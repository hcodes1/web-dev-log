<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hc - Contact</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <h1>Contact Me</h1>
    <p>Feel free to reach out!</p>

    <form action="#" method="post">
        <p>
            <label for="fullName">Your Name:</label><br>
            <input type="text" name="fullName">
        </p>
        <p>
            <label for="userEmail">Your Email: </label><br>
            <input type="email" name="userEmail">
        </p>
        <p>
            <label for="message">Your Message</label><br>
            <textarea id="message" name="userMessage" rows="5" cols="40"></textarea>
        </p>
        <p>
            <label for="contactReason">Reason for Contact:</label><br>
            <select id="contactReason" name="contactReason">
                <option value="">--Please choose an option--</option>
                <option value="general">General inquiry</option>
                <option value="collaboration">Collaboration Opportunity</option>
                <option value="other">Other</option>
            </select>
        </p>
    </form>
</body>
</html>
